<style>
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:#fff;font-family:'Manrope',sans-serif;overflow-x:hidden}
img,svg{max-width:100%}
h1,h2,h3{text-wrap:balance;overflow-wrap:break-word}
p,summary,label{text-wrap:pretty;overflow-wrap:break-word}
input,textarea,select,button{max-width:100%;box-sizing:border-box}
button{font-family:inherit;cursor:pointer}
.fl{position:absolute;top:-2%;z-index:2;pointer-events:none;border-radius:50%;background:#fff;box-shadow:0 0 5px 1px rgba(255,255,255,.6);opacity:0;animation:fall 9s linear infinite,sway 3s ease-in-out infinite alternate}
@keyframes fall{0%{top:4%;opacity:0}10%{opacity:.9}90%{opacity:.8}100%{top:97%;opacity:0}}
@keyframes sway{from{margin-left:0}to{margin-left:var(--dx)}}
.tw{animation:tw 3s ease-in-out infinite;filter:drop-shadow(0 0 5px currentColor)}
@keyframes tw{0%{opacity:.18}9%{opacity:1}24%{opacity:.18}100%{opacity:.18}}
.mound{animation:mound 14s ease-in-out infinite alternate}
@keyframes mound{from{transform:translateY(46px)}to{transform:translateY(0)}}
@keyframes orbGlow{0%,100%{box-shadow:0 0 0 1.5px rgba(255,255,255,.9),0 0 12px 2px rgba(255,226,60,.55)}50%{box-shadow:0 0 0 1.5px #fff,0 0 22px 7px rgba(255,226,60,.95)}}
.lg-hdr .ch.orb-red{animation:chIn .6s cubic-bezier(.22,.61,.36,1) both,orbGlow 2.8s ease-in-out infinite;animation-delay:calc(var(--d,0s) + var(--i) * .16s),1.6s}
.dcin::placeholder{color:rgba(255,255,255,.45)}
.ch{font-weight:inherit}
b.ch{font-weight:600;display:inline-block}
@keyframes chIn{from{opacity:0;transform:translateY(8px) scale(.7)}to{opacity:1;transform:none}}
@keyframes bbIn{0%{opacity:0;transform:scale(0)}70%{opacity:1;transform:scale(1.25)}100%{opacity:1;transform:scale(1)}}
@keyframes hatDrop{0%{opacity:0;transform:translate(-14px,-90px) rotate(-30deg)}55%{opacity:1;transform:translate(0,3px) rotate(7deg)}75%{transform:translate(0,-5px) rotate(-3deg)}100%{opacity:1;transform:none}}
html.js-rv .lg-ftr:not(.go) .ch,html.js-rv .lg-ftr:not(.go) .bb,html.js-rv .lg-ftr:not(.go) .hat{opacity:0}
.lg-ftr.go .ch,.lg-hdr .ch{animation:chIn .6s cubic-bezier(.22,.61,.36,1) both;animation-delay:calc(var(--d,0s) + var(--i) * .16s)}
.lg-ftr.go .bb,.lg-hdr .bb{animation:bbIn .7s ease both;animation-delay:calc(var(--d,0s) + .9s + var(--k) * .22s)}
.lg-ftr.go .hat,.lg-hdr .hat{animation:hatDrop 1.3s cubic-bezier(.3,.7,.4,1) both;animation-delay:calc(var(--d,0s) + 1.1s);transform-origin:50% 100%}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 34px;border-radius:10px;background:linear-gradient(180deg,#f6dd96 0%,#e3bd62 55%,#c9a04a 100%);color:#17140a;text-decoration:none;font-family:'Poppins','Manrope',sans-serif;font-size:15px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 10px 26px rgba(243,210,122,.22),0 2px 4px rgba(0,0,0,.25);transition:transform .2s ease,box-shadow .2s ease,filter .2s ease}
.cta:hover{transform:translateY(-1px);filter:brightness(1.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 12px 26px rgba(0,0,0,.55),0 2px 4px rgba(0,0,0,.4)}
.cta:active{transform:translateY(0);filter:brightness(.96)}
.cta:focus-visible{outline:2px solid #fff;outline-offset:3px}
.bk{position:absolute;display:block;border-radius:50%;filter:blur(7px);animation:breathe 6s ease-in-out infinite alternate}
@keyframes breathe{from{transform:scale(.85);opacity:.35}to{transform:scale(1.1);opacity:.85}}
.cta.cta-light{background:#fff;color:#113a00;box-shadow:0 8px 20px rgba(0,0,0,.35),0 2px 4px rgba(0,0,0,.25)}
.cta.cta-light:hover{filter:brightness(.96)}
.noscroll{scrollbar-width:none}
.noscroll::-webkit-scrollbar{display:none}
.dwn{animation:dwn 1.8s ease-in-out infinite}
.dwn:hover{color:#2f7d3a!important}
@keyframes menuIn{from{transform:translateX(-100%)}to{transform:none}}
.mdr{animation:menuIn .28s ease}
@keyframes dwn{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
.ac summary{list-style:none;cursor:pointer}.ac summary::-webkit-details-marker{display:none}.ac .acc{flex:none;transition:transform .25s ease}.ac[open] .acc{transform:rotate(180deg)}
.vds{transition:transform .12s ease,background .2s ease,color .2s ease}
.vds:active{transform:scale(.97)}
.vd[open] .vds{background:#f3d27a!important;color:#1b1405!important}
.vd[open] .vdb{animation:vdIn .35s ease both}
@keyframes vdIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.vd summary::-webkit-details-marker{display:none}
.vd .vdc{transition:transform .25s ease}
.vd[open] .vdc{transform:rotate(180deg)}
.bfr{width:calc(100% - 1px);height:calc(100% - 1px)}
@keyframes drawBtn{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
html.js-rv .btnf .bfr{stroke-dashoffset:1}
html.js-rv .btnf.in .bfr{animation:drawBtn 2s cubic-bezier(.4,0,.2,1) .15s both}
html.js-rv .btnf.in .bfr-lg{animation-duration:3s}
html.js-rv .rvs:not(.in) .fl{animation-play-state:paused}
.rvs{transition:opacity 3s ease}
html.js-rv .rvs:not(.in){opacity:0}
html.js-rv .rvb{opacity:0;transition:opacity 5.5s cubic-bezier(.4,0,.2,1)}
html.js-rv .rvb.in{opacity:1}
html.js-rv .rvf{opacity:0;-webkit-mask-image:linear-gradient(to bottom,#000 40%,transparent 100%);mask-image:linear-gradient(to bottom,#000 40%,transparent 100%);-webkit-mask-size:100% 250%;mask-size:100% 250%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:0 100%;mask-position:0 100%;transition:opacity 5.5s cubic-bezier(.4,0,.2,1),-webkit-mask-position 7s cubic-bezier(.25,.6,.3,1),mask-position 7s cubic-bezier(.25,.6,.3,1)}
html.js-rv .rvf.in{opacity:1;-webkit-mask-position:0 0;mask-position:0 0}
@keyframes garFall{0%{opacity:0;transform:translate(115%,-46px) rotate(9deg)}55%{opacity:1;transform:translate(-3%,5px) rotate(-1.5deg)}78%{transform:translate(1.2%,-2px) rotate(.6deg)}100%{opacity:1;transform:none}}
@keyframes garSway{from{transform:rotate(-.6deg)}to{transform:rotate(.6deg)}}
html.js-rv .lg-ftr:not(.go) + .gar{opacity:0}
.lg-ftr.go + .gar{transform-origin:100% 0;animation:garFall 2.6s cubic-bezier(.25,.8,.3,1) 2.5s both,garSway 5s ease-in-out 5.2s infinite alternate}
.gar .tw{filter:drop-shadow(0 0 8px currentColor)}
footer h2,footer p,footer nav a{text-shadow:0 2px 7px rgba(0,0,0,.6)}
html.js-rv .rvt{opacity:0;transform:translateY(26px);filter:blur(5px);transition:opacity 1.3s cubic-bezier(.22,.61,.36,1),transform 1.3s cubic-bezier(.22,.61,.36,1),filter 1.3s cubic-bezier(.22,.61,.36,1)}
html.js-rv .rvt.in{opacity:1;transform:none;filter:none}
html.js-rv .rv{opacity:0;transform:translateY(46px);transition:opacity 2.2s cubic-bezier(.22,.61,.36,1),transform 2.2s cubic-bezier(.22,.61,.36,1)}
html.js-rv .rv.in{opacity:1;transform:none}
html.js-rv .rv2{transition-delay:.25s}
html.js-rv .rv3{transition-delay:.5s}
html.js-rv .rv4{transition-delay:.75s}

@media (prefers-reduced-motion:reduce){.fl,.tw,.mound,.ch,.bb,.hat,.gar,.bfr,.bk,.dwn,.vdb{animation:none!important;opacity:1!important;stroke-dashoffset:0!important}html.js-rv .rv,html.js-rv .rvb,html.js-rv .rvf,html.js-rv .rvt{opacity:1;transform:none;transition:none}html.js-rv .rvs .fl{animation-play-state:running}.fl{display:none}}


select{font-family:inherit}
</style>
</helmet>
